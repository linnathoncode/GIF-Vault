<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="assist.pageTitle">Grant Access</title>
  <link rel="stylesheet" href="./permission-assist.css">
</head>
<body>
  <main class="wrap">
    <section class="panel">
      <h1 data-i18n="assist.heading">Grant Site Access</h1>
      <p data-i18n="assist.intro">This import needs temporary site access before GIF Vault can fetch the media.</p>
      <div id="reason" class="reason"></div>
      <div id="origins" class="origins" hidden>
        <strong data-i18n="assist.requestedHosts">Requested hosts</strong>
        <ul id="originsList"></ul>
      </div>
      <div id="status" class="status" data-i18n="assist.checkingAccess">Checking required access...</div>
      <div class="actions">
        <button id="grantBtn" class="primary" disabled data-i18n="assist.grantAndImportButton">Grant &amp; Import</button>
        <button id="cancelBtn" class="secondary" type="button" data-i18n="assist.cancelButton">Cancel</button>
      </div>
    </section>
  </main>
  <script type="module" src="./permission-assist.js"></script>
</body>
</html>
