<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="assist.pageTitle">Grant Access</title>
  <link rel="stylesheet" href="./permission-assist.css">
</head>
<body>
  <main class="wrap">
    <section class="panel">
      <h1>
        <img class="btn-icon" src="../../assets/shared/icon-confirm.svg" alt="" aria-hidden="true">
        <span data-i18n="assist.heading">Grant Site Access</span>
      </h1>
      <p data-i18n="assist.accessHint">Review the requested hosts, then grant access to continue this import.</p>
      <div id="reason" class="reason"></div>
      <div id="origins" class="origins" hidden>
        <strong>
          <img class="btn-icon" src="../../assets/shared/icon-hosts.svg" alt="" aria-hidden="true">
          <span data-i18n="assist.requestedHosts">Requested hosts</span>
        </strong>
        <ul id="originsList"></ul>
      </div>
      <div id="status" class="status" data-i18n="assist.checkingAccess">Checking required access...</div>
      <div class="actions">
        <button id="grantBtn" class="primary icon-text-btn" disabled>
          <img class="btn-icon" src="../../assets/shared/icon-confirm.svg" alt="" aria-hidden="true">
          <span data-i18n="assist.grantAndImportButton">Grant &amp; Import</span>
        </button>
        <button id="cancelBtn" class="secondary icon-text-btn" type="button">
          <img class="btn-icon" src="../../assets/shared/icon-delete.svg" alt="" aria-hidden="true">
          <span data-i18n="assist.cancelButton">Cancel</span>
        </button>
      </div>
    </section>
  </main>
  <script type="module" src="./permission-assist.js"></script>
</body>
</html>
