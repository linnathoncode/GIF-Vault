<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="logs.pageTitle">GIF Vault Logs</title>
  <link rel="stylesheet" href="logs.css">
</head>
<body>
  <main class="wrap">
    <section class="panel header">
      <h1 class="title" data-i18n="logs.heading">GIF Vault Debug Logs</h1>
      <div class="actions">
        <button id="themeToggleBtn" class="icon-btn" type="button" title="Toggle Theme" aria-label="Toggle Theme" data-i18n-title="common.toggleTheme" data-i18n-aria-label="common.toggleTheme">
          <img id="themeToggleIcon" class="btn-icon btn-icon-md" src="../../assets/shared/icon-theme-light.svg" alt="" aria-hidden="true" />
        </button>
        <button id="viewToggleBtn" class="btn icon-text-btn" type="button">
          <img id="viewToggleIcon" class="btn-icon" src="../../assets/shared/icon-view-expand.svg" alt="" aria-hidden="true" />
          <span data-i18n="logs.expandAllButton">Expand all</span>
        </button>
        <button id="reportBugBtn" class="btn icon-text-btn" type="button">
          <img class="btn-icon" src="../../assets/shared/icon-report-bug.svg" alt="" aria-hidden="true" />
          <span data-i18n="logs.reportBugButtonCollapsed">Report bug</span>
        </button>
        <button id="refreshBtn" class="btn icon-text-btn" type="button">
          <img class="btn-icon" src="../../assets/shared/icon-refresh.svg" alt="" aria-hidden="true" />
          <span data-i18n="logs.refreshButton">Refresh</span>
        </button>
        <button id="clearBtn" class="btn icon-text-btn" type="button">
          <img class="btn-icon" src="../../assets/shared/icon-clear.svg" alt="" aria-hidden="true" />
          <span data-i18n="logs.clearButton">Clear</span>
        </button>
      </div>
    </section>

    <section id="reportPanel" class="panel report-panel" hidden>
      <label
        id="bugDescriptionLabel"
        for="bugDescriptionInput"
        class="report-label"
        data-i18n="logs.reportDescriptionLabel"
      >What happened?</label>
      <textarea
        id="bugDescriptionInput"
        class="report-input"
        rows="4"
        data-i18n-placeholder="logs.reportDescriptionPlaceholder"
        placeholder="Describe what you encountered"
      ></textarea>
      <div id="reportAttachmentHint" class="report-warning">
        <img class="report-warning-icon" src="../../assets/shared/icon-warning.svg" alt="" aria-hidden="true" />
        <p
          class="status report-hint"
          data-i18n="logs.reportAttachmentHint"
        >A log file will be downloaded automatically. Attach it to the email before sending.</p>
        <button id="sendReportBtn" class="btn icon-text-btn" type="button">
          <img class="btn-icon" src="../../assets/shared/icon-send-email.svg" alt="" aria-hidden="true" />
          <span data-i18n="logs.reportBugButtonExpanded">Send by email</span>
        </button>
      </div>
      <div id="reportStatus" class="status" hidden></div>
    </section>

    <section class="panel">
      <div id="status" class="status" data-i18n="logs.loadingLogs">Loading logs...</div>
    </section>

    <section class="panel">
      <div class="status-line">
        <img class="btn-icon" src="../../assets/shared/icon-storage.svg" alt="" aria-hidden="true" />
        <div id="storageUsage" class="status" data-i18n="logs.storageCalculating">Storage: calculating...</div>
      </div>
    </section>

    <section class="panel logs-panel">
      <div id="logs" class="logs" data-i18n="logs.loading">Loading...</div>
    </section>
  </main>

  <script type="module" src="logs.js"></script>
</body>
</html>
