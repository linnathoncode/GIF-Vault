<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="popup.pageTitle">GIF Vault</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="container">
    <section class="panel header">
      <div class="brand">
        <img id="brandLogo" class="brand-logo" src="../../assets/icons/brand/icon-dark.svg" alt="GIF Vault logo" data-i18n-alt="popup.brandLogoAlt" />
        <div class="brand-text">
        <h1 class="title" data-i18n="common.appName">GIF Vault</h1>
        <div id="count" class="count">0 saved</div>
        </div>
      </div>
      <div class="header-actions">
        <div id="selectedCount" class="selection-count" aria-live="polite" hidden></div>
        <button id="selectionCancelBtn" class="icon-btn selection-cancel-btn" type="button" title="Clear selection" aria-label="Clear selection" data-i18n-title="popup.clearSelectionButton" data-i18n-aria-label="popup.clearSelectionButton" hidden>
          <img class="btn-icon btn-icon-md" src="../../assets/shared/icon-cancel-x.svg" alt="" aria-hidden="true" />
        </button>
        <button id="themeToggleBtn" class="icon-btn" type="button" title="Toggle Theme" aria-label="Toggle Theme" data-i18n-title="common.toggleTheme" data-i18n-aria-label="common.toggleTheme">
          <img id="themeToggleIcon" class="btn-icon btn-icon-md" src="../../assets/shared/icon-theme-light.svg" alt="" aria-hidden="true" />
        </button>
        <button id="openOptionsBtn" class="icon-btn" type="button" title="Open Options" aria-label="Open Options" data-i18n-title="popup.openOptions" data-i18n-aria-label="popup.openOptions">
          <img class="btn-icon btn-icon-md" src="../../assets/shared/icon-open-options.svg" alt="" aria-hidden="true" />
        </button>
        <button id="openTransferBtn" class="icon-btn transfer-btn" type="button" title="Open Import &amp; Backup" aria-label="Open Import &amp; Backup" data-i18n-title="popup.openTransfer" data-i18n-aria-label="popup.openTransfer">
          <img class="btn-icon btn-icon-md" src="../../assets/shared/icon-archive-restore.svg" alt="" aria-hidden="true" />
        </button>
        <button id="clearAllBtn" class="icon-btn danger-icon-btn" type="button" title="Clear all" aria-label="Clear all" data-i18n-title="popup.clearAllButton" data-i18n-aria-label="popup.clearAllButton">
          <img class="btn-icon btn-icon-md" src="../../assets/shared/icon-clear.svg" alt="" aria-hidden="true" />
        </button>
      </div>
    </section>

    <section class="panel import-panel">
      <div class="import-row import-row-main">
        <div class="import-input-wrap">
          <input id="importInput" class="input input-with-action" type="url" placeholder="Paste GIF / MP4 / tweet URL" data-i18n-placeholder="popup.importInputPlaceholder" />
          <button id="localImportBtn" class="inline-input-icon-btn" type="button" title="Choose files" aria-label="Choose files" data-i18n-title="popup.chooseFilesButton" data-i18n-aria-label="popup.chooseFilesButton">
            <img class="btn-icon" src="../../assets/shared/icon-folder.svg" alt="" aria-hidden="true" />
          </button>
        </div>
        <button id="importBtn" class="btn primary icon-text-btn" type="button">
          <img id="importBtnIcon" class="btn-icon" src="../../assets/shared/icon-import.svg" alt="" aria-hidden="true" />
          <span id="importBtnLabel">Import</span>
        </button>
        <input id="localFileInput" type="file" class="visually-hidden-file-input" accept="image/*,video/mp4,video/webm" multiple />
      </div>
      <div class="import-row single">
        <div class="search-wrap">
          <img class="search-icon" src="../../assets/shared/icon-search.svg" alt="" aria-hidden="true" />
          <input id="searchInput" class="input" type="search" placeholder="Search by name or source" data-i18n-placeholder="popup.searchInputPlaceholder" />
        </div>
      </div>
      <div id="status" class="status" aria-live="polite">
        <div id="progressTrack" class="progress-track">
          <div id="progressBar" class="progress-bar"></div>
          <div id="progressLabel" class="progress-label"></div>
        </div>
        <div id="statusText" class="status-text"></div>
      </div>
    </section>

    <section class="panel tab-pager">
      <button id="tabAllBtn" class="btn tab-btn icon-text-btn active" type="button">
        <img class="btn-icon" src="../../assets/shared/icon-tab-all.svg" alt="" aria-hidden="true" />
        <span data-i18n="popup.tabAll">All</span>
      </button>
      <button id="tabFavoritesBtn" class="btn tab-btn icon-text-btn" type="button">
        <img class="btn-icon" src="../../assets/shared/icon-star.svg" alt="" aria-hidden="true" />
        <span data-i18n="popup.tabFavorites">Favorites</span>
      </button>
      <button id="prevPageBtn" class="btn icon-btn-small" type="button" aria-label="Previous page" data-i18n-aria-label="popup.previousPageAriaLabel">
        <img class="btn-icon" src="../../assets/shared/icon-prev-page.svg" alt="" aria-hidden="true" />
      </button>
      <div id="pageIndicator" class="page-indicator">Page 1 / 1</div>
      <button id="nextPageBtn" class="btn icon-btn-small" type="button" aria-label="Next page" data-i18n-aria-label="popup.nextPageAriaLabel">
        <img class="btn-icon" src="../../assets/shared/icon-next-page.svg" alt="" aria-hidden="true" />
      </button>
    </section>

    <section id="grid" class="grid" aria-live="polite"></section>
  </main>
  <div id="hoverPreview" class="hover-preview" aria-hidden="true">
    <img id="hoverPreviewImg" class="hover-preview-img" alt="" />
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
